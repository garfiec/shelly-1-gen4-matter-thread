# Builds the builder image (.devcontainer/Dockerfile: ESP-IDF, esp-matter and
# CHIP, about 12 GB) for amd64 and arm64 and pushes it to GHCR as
# ghcr.io/<owner>/shelly-gen4-builder:df-<hash of the Dockerfile>
# (scripts/builder-image-tag.sh). Too big for the Actions cache, so CI pulls it
# from there instead of building it on every run.
#
# CI calls this when the image for the current Dockerfile is missing. Run it by
# hand (Actions > Builder image > Run workflow) to build it ahead of time.
name: Builder image

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: builder-image
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
      tag: ${{ steps.tag.outputs.tag }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shelly-gen4-builder"
          tag="$(scripts/builder-image-tag.sh)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image:$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$image:$tag already exists" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    if: needs.tag.outputs.exists != 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: scripts/ci-free-disk.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ needs.tag.outputs.image }}:${{ needs.tag.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Builder for the Shelly Gen4 Matter over Thread firmware (ESP-IDF, esp-matter)

  manifest:
    needs: [tag, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the two architectures
        env:
          IMAGE: ${{ needs.tag.outputs.image }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          echo "Pushed $IMAGE:$TAG (amd64, arm64)" >> "$GITHUB_STEP_SUMMARY"
